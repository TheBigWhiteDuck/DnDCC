<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Podgląd PDF (z numerami stron)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen space-y-6">

  <!-- Przyciski -->
  <button id="openPdfBtn" class="px-6 py-3 bg-blue-600 text-white rounded-xl shadow-lg hover:bg-blue-700">
    Otwórz cały PDF
  </button>


  <select id="raceSelect" class="px-4 py-2 border rounded">
    <option value="Krasnoludy" data-start="19" data-end="21">Krasnoludy</option>
    <option value="Elfy" data-start="22" data-end="26">Elfy</option>
    <option value="Niziolki" data-start="27" data-end="29">Niziołki</option>
    <option value="Ludzie" data-start="30" data-end="32">Ludzie</option>
    <option value="Smokoludzie" data-start="33" data-end="35">Smokoludzie</option>
    <option value="Gnomy" data-start="36" data-end="38">Gnomy</option>
    <option value="PółElfy" data-start="39" data-end="40">Półelfy</option>
    <option value="PółOrki" data-start="41" data-end="42">Półorki</option>
    <option value="Diabelstwa" data-start="43" data-end="44">Diabelstwa</option>
  </select>
  <button id="selectPdfBtnRace" class="px-6 py-3 bg-green-600 text-white rounded-xl mt-4">
    Otwórz rasę w PDF
  </button>

  <select id="classSelect" class="px-4 py-2 border rounded">
    <option value="Barbarzyńca" data-start="47" data-end="51">Barbarzyńca</option>
    <option value="Bard" data-start="52" data-end="56">Bard</option>
    <option value="Kleryk" data-start="57" data-end="64">Kleryk</option>
    <option value="Druid" data-start="65" data-end="70">Druid</option>
    <option value="Wojownik" data-start="71" data-end="76">Wojownik</option>
    <option value="Mnich" data-start="77" data-end="82">Mnich</option>
    <option value="Paladyn" data-start="83" data-end="89">Pladyn</option>
    <option value="Łotr" data-start="90" data-end="94">Łotr</option>
    <option value="Łowca" data-start="95" data-end="99">Łowca</option>
    <option value="Zaklinacz" data-start="100" data-end="105">Zaklinacz</option>
    <option value="Czarnoksiężnik" data-start="106" data-end="112">Czarnoksiężnik</option>
    <option value="Mag" data-start="113" data-end="120">Mag</option>
  </select>
  <button id="selectPdfBtnClass" class="px-6 py-3 bg-green-600 text-white rounded-xl mt-4">
    Otwórz klasę w PDF
  </button>

  <button id="selectPdfBtnEq" class="px-6 py-3 bg-green-600 text-white rounded-xl mt-4">
    Otwórz ekwipunek w PDF
  </button>

  <button id="selectPdfBtnOr" class="px-6 py-3 bg-green-600 text-white rounded-xl mt-4">
    Otwórz pochodzenie w PDF
  </button>

  <!-- Modal -->
  <div id="pdfModal" class="fixed inset-0 bg-black bg-opacity-70 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-11/12 md:w-4/5 lg:w-3/4 xl:w-2/3 h-[85vh] flex flex-col relative">
      
      <!-- Pasek nagłówka -->
      <div class="flex justify-between items-center p-4 border-b border-gray-300">
        <h2 id="pdfTitle" class="text-lg font-semibold">Podgląd dokumentu</h2>
        <button id="closePdfBtn" class="text-gray-500 hover:text-gray-700 text-3xl leading-none">&times;</button>
      </div>

      <!-- Kontener PDF -->
      <div id="pdfContainer" class="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-8"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const openAllBtn = document.getElementById('openPdfBtn');
    const selectBtnRace = document.getElementById('selectPdfBtnRace');
    const selectBtnClass = document.getElementById('selectPdfBtnClass');
    const orBtn = document.getElementById('selectPdfBtnOr');
    const eqBtn = document.getElementById('selectPdfBtnEq');

    const closeBtn = document.getElementById('closePdfBtn');
    const modal = document.getElementById('pdfModal');
    const container = document.getElementById('pdfContainer');
    const title = document.getElementById('pdfTitle');

    const url = "Players_Handbook.pdf";
    let currentRender = null; // kontrola aktywnego renderowania

    async function renderPdf(startPage = 1, endPage = null) {
      // przerwij poprzednie renderowanie
      if (currentRender) {
        currentRender.cancelled = true;
      }

      const renderSession = { cancelled: false };
      currentRender = renderSession;

      container.innerHTML = "";
      const pdf = await pdfjsLib.getDocument(url).promise;
      const totalPages = pdf.numPages;
      if (!endPage || endPage > totalPages) endPage = totalPages;

      for (let i = startPage; i <= endPage; i++) {
        if (renderSession.cancelled) return;

        const page = await pdf.getPage(i);
        const scale = 1.1;
        const viewport = page.getViewport({ scale });

        // wrapper do wyśrodkowania
        const pageWrapper = document.createElement("div");
        pageWrapper.classList.add("flex", "flex-col", "items-center");

        // canvas (strona PDF)
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.classList.add("shadow", "rounded", "bg-white");
        pageWrapper.appendChild(canvas);

        // podpis pod stroną
        const pageLabel = document.createElement("p");
        pageLabel.textContent = `Strona ${i}`;
        pageLabel.classList.add("text-sm", "text-gray-500", "mt-2");
        pageWrapper.appendChild(pageLabel);

        container.appendChild(pageWrapper);

        await page.render({ canvasContext: context, viewport }).promise;

        if (renderSession.cancelled) return;
      }

      currentRender = null;
    }

    // Otwieranie pełnego PDF-a
    openAllBtn.addEventListener('click', async () => {
      title.textContent = "Podgląd całego dokumentu";
      modal.classList.remove('hidden');
      container.innerHTML = `<p class="text-gray-500 text-center mt-6">Ładowanie...</p>`;
      await renderPdf(1);
    });

    // Otwieranie rasy
    selectBtnRace.addEventListener('click', async () => {
      const v = document.getElementById('raceSelect');
      const option = v.options[v.selectedIndex];
      title.textContent = v.value;
      modal.classList.remove('hidden');
      container.innerHTML = `<p class="text-gray-500 text-center mt-6">Ładowanie wybranych stron...</p>`;
      const start = parseInt(option.getAttribute("data-start"));
      const end = parseInt(option.getAttribute("data-end"));
      await renderPdf(start, end);
    });

    selectBtnClass.addEventListener('click', async () => {
      const v = document.getElementById('classSelect');
      const option = v.options[v.selectedIndex];
      title.textContent = v.value;
      modal.classList.remove('hidden');
      container.innerHTML = `<p class="text-gray-500 text-center mt-6">Ładowanie wybranych stron...</p>`;
      const start = parseInt(option.getAttribute("data-start"));
      const end = parseInt(option.getAttribute("data-end"));
      await renderPdf(start, end);
    });

    eqBtn.addEventListener('click', async () => {
      title.textContent = "Ekwipunek";
      modal.classList.remove('hidden');
      container.innerHTML = `<p class="text-gray-500 text-center mt-6">Ładowanie wybranych stron...</p>`;
      await renderPdf(144, 162);
    });

    orBtn.addEventListener('click', async () => {
      title.textContent = "Pochodzenia";
      modal.classList.remove('hidden');
      container.innerHTML = `<p class="text-gray-500 text-center mt-6">Ładowanie wybranych stron...</p>`;
      await renderPdf(126, 142);
    });

    // Zamykanie modala
    closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });
  </script>
</body>
</html>
