<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rzut kostką RPG</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .scene {
            width: 120px;
            height: 120px;
            perspective: 600px;
            margin: 20px 0;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(.25, .8, .25, 1);
        }

        .face {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #222;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .front  { transform: rotateY(0deg) translateZ(60px); }
        .back   { transform: rotateY(180deg) translateZ(60px); }
        .right  { transform: rotateY(90deg) translateZ(60px); }
        .left   { transform: rotateY(-90deg) translateZ(60px); }
        .top    { transform: rotateX(90deg) translateZ(60px); }
        .bottom { transform: rotateX(-90deg) translateZ(60px); }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
<h1>Rzut kostką RPG</h1>

<!-- WYBÓR POSTACI -->
<select id="characterSelect"></select>

<!-- WYBÓR STATYSTYKI -->
<div class="controls">
    <label><input type="radio" name="stat" value="STR" checked> STR</label>
    <label><input type="radio" name="stat" value="DEX"> DEX</label>
    <label><input type="radio" name="stat" value="CON"> CON</label>
    <label><input type="radio" name="stat" value="INT"> INT</label>
    <label><input type="radio" name="stat" value="WIS"> WIS</label>
    <label><input type="radio" name="stat" value="CHA"> CHA</label>
</div>

<!-- WYBÓR KOSTKI -->
<div class="controls">
    <label><input type="radio" name="dice" value="4"> d4</label>
    <label><input type="radio" name="dice" value="6"> d6</label>
    <label><input type="radio" name="dice" value="8"> d8</label>
    <label><input type="radio" name="dice" value="10"> d10</label>
    <label><input type="radio" name="dice" value="12"> d12</label>
    <label><input type="radio" name="dice" value="20" checked> d20</label>
    <label><input type="radio" name="dice" value="100"> d100</label>
</div>

<div class="scene">
    <div class="cube" id="cube">
        <div class="face front">X</div>
        <div class="face back">X</div>
        <div class="face right">X</div>
        <div class="face left">X</div>
        <div class="face top">X</div>
        <div class="face bottom">X</div>
    </div>
</div>

<button onclick="roll()">Rzuć</button>

<h2 id="result">—</h2>

<script>
/* ===============================
   DANE POSTACI (JSON)
================================ */

const characters = [
    {
        id: "aelar",
        name: "Aelar Thalanil",
        data: {
            "STRmod": "-1",
            "DEXmod ": "+2",
            "CONmod": "+1",
            "INTmod": "+4",
            "WISmod": "+1",
            "CHamod": "0"
        }
    },
    {
        id: "warrior",
        name: "Test Warrior",
        data: {
            "STRmod": "+3",
            "DEXmod ": "+1",
            "CONmod": "+2",
            "INTmod": "-1",
            "WISmod": "0",
            "CHamod": "-2"
        }
    }
];

const STAT_MOD_KEYS = {
    STR: "STRmod",
    DEX: "DEXmod ",
    CON: "CONmod",
    INT: "INTmod",
    WIS: "WISmod",
    CHA: "CHamod"
};

/* ===============================
   UI INIT
================================ */

const cube = document.getElementById("cube");
const resultEl = document.getElementById("result");
const characterSelect = document.getElementById("characterSelect");

characters.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    characterSelect.appendChild(opt);
});

/* ===============================
   HELPERS
================================ */

function getDiceType() {
    return +document.querySelector('input[name="dice"]:checked').value;
}

function getSelectedStat() {
    return document.querySelector('input[name="stat"]:checked').value;
}

function getSelectedCharacter() {
    return characters.find(c => c.id === characterSelect.value);
}

function parseMod(value) {
    return parseInt(value, 10) || 0;
}

/* ===============================
   ROLL
================================ */

function roll() {
    const sides = getDiceType();
    const stat = getSelectedStat();
    const character = getSelectedCharacter();

    const modKey = STAT_MOD_KEYS[stat];
    const mod = parseMod(character.data[modKey]);

    const rotateX = Math.random() * 360 + 360;
    const rotateY = Math.random() * 360 + 360;
    cube.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

    setTimeout(() => {
        const roll = Math.floor(Math.random() * sides) + 1;
        const total = roll + mod;

        document.querySelectorAll(".face").forEach(
            f => f.textContent = roll
        );

        cube.style.transform = "rotateX(0deg) rotateY(0deg)";

        resultEl.textContent =
            `${character.name} | ${stat}: ${roll} ${mod >= 0 ? "+" : ""}${mod} = ${total}`;

        console.log({ roll, mod, total });
    }, 800);
}
</script>

</body>
</html>
